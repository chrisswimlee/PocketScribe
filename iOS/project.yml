# iOS app. Generate the Xcode project with:  cd iOS && xcodegen
# The shared engine (transcription, summaries, library model) is the PocketPadCore
# library in the Swift package one folder up, which the Mac app and CLI use too.
name: PocketPad
options:
  bundleIdPrefix: dev.chrisswimlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PocketPad:
    path: ..
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketPad:
    type: application
    platform: iOS
    sources:
      - path: PocketPad
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PocketPad
        product: PocketPadCore
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisswimlee.PocketPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PocketPad/Info.plist
      properties:
        CFBundleDisplayName: PocketPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: PocketPad records your voice and meetings to transcribe them. Audio stays on this iPhone.
        NSRemindersFullAccessUsageDescription: PocketPad adds the action items you choose to Reminders.
        NSCalendarsWriteOnlyAccessUsageDescription: PocketPad adds the action items you choose to your calendar. It never reads your events.
        NSLocalNetworkUsageDescription: PocketPad can send transcripts to a Mac on your network running Ollama or LM Studio for summaries, if you set that up in Settings.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.chrisswimlee.PocketPad
            CFBundleURLSchemes: [pocketpad]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, org.openxmlformats.wordprocessingml.document, org.openxmlformats.presentationml.presentation, public.plain-text, public.rtf, net.daringfireball.markdown]
