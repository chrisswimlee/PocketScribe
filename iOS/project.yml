# iOS app. Generate the Xcode project with:  cd iOS && xcodegen
# The shared engine (transcription, summaries, library model) is the PocketScribeCore
# library in the Swift package one folder up, which the Mac app and CLI use too.
name: PocketScribe
options:
  bundleIdPrefix: dev.chrisswimlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PocketScribe:
    path: ..
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketScribe:
    type: application
    platform: iOS
    sources:
      - path: PocketScribe
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PocketScribe
        product: PocketScribeCore
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisswimlee.PocketScribe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PocketScribe/Info.plist
      properties:
        CFBundleDisplayName: Pocket Scribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Pocket Scribe records your voice and meetings to transcribe them. Audio stays on this iPhone.
        NSRemindersFullAccessUsageDescription: Pocket Scribe adds the action items you choose to Reminders.
        NSCalendarsWriteOnlyAccessUsageDescription: Pocket Scribe adds the action items you choose to your calendar. It never reads your events.
        NSLocalNetworkUsageDescription: Pocket Scribe can send transcripts to a Mac on your network running Ollama or LM Studio for summaries, if you set that up in Settings.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.chrisswimlee.PocketScribe
            CFBundleURLSchemes: [pocketscribe]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, org.openxmlformats.wordprocessingml.document, org.openxmlformats.presentationml.presentation, public.plain-text, public.rtf, net.daringfireball.markdown]
