# iOS app. Generate the Xcode project with:  cd iOS && xcodegen
# The shared engine (transcription, summaries, library model) is the LocalSummaryCore
# library in the Swift package one folder up, which the Mac app and CLI use too.
name: LocalNotes
options:
  bundleIdPrefix: dev.chrisswimlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LocalSummary:
    path: ..
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LocalNotes:
    type: application
    platform: iOS
    sources:
      - path: LocalNotes
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LocalSummary
        product: LocalSummaryCore
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisswimlee.LocalNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LocalNotes/Info.plist
      properties:
        CFBundleDisplayName: LocalNotes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: LocalNotes records your voice and meetings to transcribe them. Audio stays on this iPhone.
        NSLocalNetworkUsageDescription: LocalNotes can send transcripts to a Mac on your network running Ollama or LM Studio for summaries, if you set that up in Settings.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.chrisswimlee.LocalNotes
            CFBundleURLSchemes: [localnotes]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
